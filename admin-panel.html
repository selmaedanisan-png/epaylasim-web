<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>e.paylasim Admin</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#C4175A;--brand-dark:#9E1248;--brand-light:#FCE8F0;--accent:#891AAE;--gold:#DFA020;
  --bg:#f8fafc;--bg-alt:#f1f5f9;--card:#fff;--card-hover:#fafafa;
  --border:#e2e8f0;--border-light:#f1f5f9;
  --text:#0f172a;--text-soft:#475569;--text-muted:#94a3b8;
  --sidebar-bg:#0f172a;--sidebar-text:#94a3b8;--sidebar-active:rgba(196,23,90,.15);--sidebar-active-text:#fff;
  --success:#16a34a;--success-bg:#dcfce7;--warning:#d97706;--warning-bg:#fef3c7;--danger:#dc2626;--danger-bg:#fee2e2;--info:#2563eb;--info-bg:#dbeafe;
  --radius:10px;--radius-lg:16px;--shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 8px 30px rgba(0,0,0,.08);
  --sidebar-w:260px;--topbar-h:64px;
}
[data-theme="dark"]{
  --bg:#0c0f1a;--bg-alt:#111827;--card:#1e2235;--card-hover:#252a40;
  --border:#2d3348;--border-light:#1e2235;
  --text:#e2e8f0;--text-soft:#94a3b8;--text-muted:#64748b;
  --sidebar-bg:#0a0d16;--sidebar-text:#64748b;
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 8px 30px rgba(0,0,0,.4);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e1b4b,#312e81);padding:20px;position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(196,23,90,.15),transparent 70%);top:-200px;right:-200px;border-radius:50%}
.login-wrap::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(137,26,174,.1),transparent 70%);bottom:-100px;left:-100px;border-radius:50%}
.login-card{background:rgba(255,255,255,.03);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px 40px;width:100%;max-width:440px;position:relative;z-index:1}
.login-card .logo-area{text-align:center;margin-bottom:36px}
.login-card .logo-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 32px rgba(196,23,90,.3)}
.login-card .logo-icon svg{width:36px;height:36px;color:#fff}
.login-card .logo-text{font-size:28px;font-weight:800;color:#fff;letter-spacing:-.5px}
.login-card .logo-text .dot{color:var(--gold)}
.login-card .logo-sub{font-size:13px;color:rgba(255,255,255,.5);margin-top:4px}
.l-group{margin-bottom:20px}
.l-group label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.l-group .l-input-wrap{position:relative}
.l-group input{width:100%;padding:14px 16px;padding-right:44px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:14px;outline:none;transition:all .2s}
.l-group input::placeholder{color:rgba(255,255,255,.3)}
.l-group input:focus{border-color:var(--brand);background:rgba(255,255,255,.08)}
.l-group .l-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.4);display:flex;padding:4px}
.l-group .l-toggle:hover{color:rgba(255,255,255,.7)}
.l-group .l-error{color:#f87171;font-size:12px;margin-top:6px;display:none}
.l-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;transition:all .3s;box-shadow:0 4px 16px rgba(196,23,90,.3)}
.l-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(196,23,90,.4)}
.l-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.otp-wrap{display:none}
.otp-badge{background:rgba(196,23,90,.15);border:1px solid rgba(196,23,90,.2);border-radius:12px;padding:16px;text-align:center;margin-bottom:24px}
.otp-badge p{font-size:13px;color:rgba(255,255,255,.7)}
.otp-badge .phone{font-weight:700;font-size:16px;color:#fff;margin-top:4px;letter-spacing:1px}
.otp-boxes{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.otp-boxes input{width:50px;height:58px;text-align:center;font-size:24px;font-weight:700;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;outline:none;transition:border-color .2s}
.otp-boxes input:focus{border-color:var(--brand)}
.otp-footer{text-align:center;font-size:13px;color:rgba(255,255,255,.4)}
.otp-footer button{background:none;border:none;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer}
.otp-footer button:disabled{color:rgba(255,255,255,.2);cursor:not-allowed}

.lock-screen{display:none;text-align:center;color:rgba(255,255,255,.7)}
.lock-screen svg{width:56px;height:56px;color:#f87171;margin-bottom:16px}
.lock-screen p{margin-bottom:8px}
.lock-screen .lock-timer{font-size:28px;font-weight:800;color:var(--brand);margin:12px 0}
.lock-screen .unlock-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:600;margin-top:12px}

/* ===== ADMIN LAYOUT ===== */
.admin{display:none;min-height:100vh}

/* Sidebar */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);z-index:80;display:flex;flex-direction:column;transition:transform .3s}
.sb-head{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.3px}
.sb-logo .dot{color:var(--gold)}
.sb-badge{display:inline-block;font-size:9px;font-weight:700;background:var(--brand);color:#fff;padding:2px 8px;border-radius:100px;margin-left:6px;vertical-align:middle}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px}
.sb-nav::-webkit-scrollbar{width:4px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.sb-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.25);padding:16px 12px 8px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--sidebar-text);transition:all .15s;margin-bottom:2px;position:relative}
.sb-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.sb-item.active{background:var(--sidebar-active);color:var(--brand)}
.sb-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--brand);border-radius:0 3px 3px 0}
.sb-item svg{width:18px;height:18px;flex-shrink:0;opacity:.7}
.sb-item.active svg{opacity:1}
.sb-item .sb-count{margin-left:auto;font-size:10px;font-weight:700;background:var(--brand);color:#fff;padding:2px 7px;border-radius:100px;min-width:20px;text-align:center}
.sb-foot{padding:12px 10px;border-top:1px solid rgba(255,255,255,.06)}

/* Topbar */
.topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:var(--card);border-bottom:1px solid var(--border);z-index:70;display:flex;align-items:center;padding:0 24px;gap:16px;transition:left .3s}
.topbar .tb-toggle{display:none;background:none;border:none;color:var(--text);padding:8px}
.topbar .tb-toggle svg{width:22px;height:22px}
.topbar .tb-search{flex:1;max-width:400px;position:relative}
.topbar .tb-search input{width:100%;padding:10px 16px 10px 40px;background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--text);outline:none}
.topbar .tb-search input:focus{border-color:var(--brand)}
.topbar .tb-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}
.topbar .tb-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text-soft);display:flex;align-items:center;justify-content:center;position:relative;transition:all .15s}
.tb-icon-btn:hover{background:var(--bg-alt);color:var(--text)}
.tb-icon-btn .notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--brand);border-radius:50%;border:2px solid var(--card)}
.tb-icon-btn svg{width:18px;height:18px}
.tb-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer}
.tb-divider{width:1px;height:28px;background:var(--border);margin:0 4px}

/* Main */
.main{margin-left:var(--sidebar-w);padding-top:var(--topbar-h);min-height:100vh;transition:margin-left .3s}
.main-inner{padding:24px}

/* Page */
.page{display:none;animation:fadeUp .3s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Page Header */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.ph h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.ph .ph-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.ph-actions{display:flex;gap:8px;align-items:center}

/* Stat Cards */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:all .2s}
.sc:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sc-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.sc-icon svg{width:20px;height:20px}
.sc-trend{font-size:11px;font-weight:600;display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:100px}
.sc-trend.up{background:var(--success-bg);color:var(--success)}
.sc-trend.down{background:var(--danger-bg);color:var(--danger)}
.sc-val{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.sc-label{font-size:12px;color:var(--text-muted);margin-top:4px}

/* Cards & Panels */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px}
.panel-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-h h2{font-size:15px;font-weight:700}
.panel-h .badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px}

/* Tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);padding:12px 16px;background:var(--bg-alt);border-bottom:1px solid var(--border);position:sticky;top:0}
.tbl td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--card-hover)}
.tbl .avatar-sm{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.badge-s{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-brand{background:var(--brand-light);color:var(--brand)}
.badge-muted{background:var(--bg-alt);color:var(--text-muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;border:none;transition:all .15s}
.btn svg{width:16px;height:16px}
.btn-brand{background:var(--brand);color:#fff}
.btn-brand:hover{background:var(--brand-dark)}
.btn-outline{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn-ghost{background:transparent;color:var(--text-soft);padding:6px 10px}
.btn-ghost:hover{background:var(--bg-alt);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}

/* Chart Container */
.chart-wrap{padding:20px;position:relative;height:300px}
.chart-wrap canvas{max-height:100%}

/* Grid helpers */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}

/* Tabs */
.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--card)}
.tab{padding:12px 16px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}

/* Filter bar */
.filter-bar{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--card);color:var(--text);outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--brand)}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.empty h3{font-size:15px;font-weight:600;color:var(--text-soft);margin-bottom:4px}
.empty p{font-size:13px}

/* KPI Row */
.kpi-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.kpi{flex:1;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:800}
.kpi-sub{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border-radius:var(--radius-lg);width:90%;max-width:500px;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:16px;font-weight:700}
.modal-head button{background:none;border:none;color:var(--text-muted);font-size:20px;padding:4px}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Form */
.fg{margin-bottom:16px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand)}
.fg textarea{min-height:80px;resize:vertical}

/* Activity Feed */
.feed-item{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border)}
.feed-item:last-child{border-bottom:none}
.feed-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.feed-content{flex:1}
.feed-content p{font-size:13px}
.feed-content .feed-time{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* Responsive */
@media(max-width:1200px){.stats-row{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-3{grid-template-columns:1fr}}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .topbar{left:0}
  .topbar .tb-toggle{display:flex}
  .main{margin-left:0}
  .stats-row{grid-template-columns:1fr}
  .ph{flex-direction:column;align-items:flex-start}
}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:75}
.mobile-overlay.show{display:block}

/* Animations */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div class="login-wrap" id="loginWrap">
<div class="login-card">
  <div class="logo-area">
    <div class="logo-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg></div>
    <div class="logo-text">e<span class="dot">.</span>paylasim</div>
    <div class="logo-sub">Yonetim Paneli</div>
  </div>

  <div id="loginStep1">
    <div class="l-group">
      <label>Kullanici Adi</label>
      <div class="l-input-wrap">
        <input type="password" id="inpUser" placeholder="Kullanici adiniz" autocomplete="off"/>
        <button type="button" class="l-toggle" onclick="togVis('inpUser',this)"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
      </div>
      <div class="l-error" id="errUser">Gecersiz kullanici adi</div>
    </div>
    <div class="l-group">
      <label>Sifre</label>
      <div class="l-input-wrap">
        <input type="password" id="inpPass" placeholder="Sifreniz" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"/>
        <button type="button" class="l-toggle" onclick="togVis('inpPass',this)"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
      </div>
      <div class="l-error" id="errPass">Gecersiz sifre</div>
    </div>
    <button class="l-btn" onclick="doLogin()">Giris Yap</button>
  </div>

  <div class="otp-wrap" id="loginStep2">
    <div class="otp-badge">
      <p id="otpStatusMsg">6 haneli dogrulama kodu gonderiliyor...</p>
      <div class="phone">selma.s*****@gmail.com</div>

  const statusEl=document.getElementById('otpStatusMsg');
  statusEl.textContent='Dogrulama kodu gonderiliyor...';
  statusEl.style.color='rgba(255,255,255,.7)';
  document.getElementById('resendBtn').disabled=true;

  try{
    const res = await fetch('https://api.web3forms.com/submit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        access_key: WEB3FORMS_KEY,
        subject: 'e.paylasim Admin Dogrulama Kodu: ' + currentOtp,
        from_name: 'e.paylasim Guvenlik',
        name: 'Admin Giris Dogrulama',
        message: 'Dogrulama Kodunuz: ' + currentOtp + '\n\nGiris zamani: ' + new Date().toLocaleString('tr-TR') + '\nSure: 5 dakika\n\nBu kodu siz talep etmediyseniz, lutfen dikkate almayin.'
      })
    });
    const data = await res.json();
    if(data.success){
      statusEl.textContent='6 haneli dogrulama kodu gonderildi ✓';
      statusEl.style.color='#4ade80';
    } else {
      throw new Error(data.message||'Gonderilemedi');
    }
  }catch(err){
    console.error('Email error:', err);
    statusEl.textContent='E-posta gonderilemedi! Tekrar deneyin.';
    statusEl.style.color='#f87171';
    document.getElementById('resendBtn').disabled=false;
    return;
  }

  let sec=90;
  const iv=setInterval(()=>{sec--;document.getElementById('otpTimer').textContent=sec>0?sec+'s':'';if(sec<=0){clearInterval(iv);document.getElementById('resendBtn').disabled=false}},1e3);
}

function buildOtpInputs(){
  const c=document.getElementById('otpBoxes');c.innerHTML='';
  for(let i=0;i<6;i++){const inp=document.createElement('input');inp.type='text';inp.maxLength=1;inp.inputMode='numeric';
    inp.oninput=function(){this.value=this.value.replace(/\D/g,'');if(this.value&&i<5)c.children[i+1].focus();if(getOtp().length===6)verifyOtp()};
    inp.onkeydown=function(e){if(e.key==='Backspace'&&!this.value&&i>0)c.children[i-1].focus()};
    inp.onpaste=function(e){e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);for(let j=0;j<t.length;j++)c.children[j].value=t[j];if(t.length===6)verifyOtp()};
    c.appendChild(inp)}
  c.children[0].focus();
}

function getOtp(){return Array.from(document.getElementById('otpBoxes').children).map(i=>i.value).join('')}

function verifyOtp(){
  const v=getOtp();if(v.length<6)return;
  document.getElementById('errOtp').style.display='none';
  if(Date.now()>otpExp){document.getElementById('errOtp').textContent='Kodun suresi doldu';document.getElementById('errOtp').style.display='block';return}
  if(v!==currentOtp){document.getElementById('errOtp').textContent='Gecersiz kod';document.getElementById('errOtp').style.display='block';Array.from(document.getElementById('otpBoxes').children).forEach(i=>i.value='');document.getElementById('otpBoxes').children[0].focus();return}
  sessionStorage.setItem(AUTH_KEY,'1');showAdmin();
}

function showAdmin(){document.getElementById('loginWrap').style.display='none';document.getElementById('adminApp').style.display='block';buildSidebar();navigate('dashboard')}
function doLogout(){sessionStorage.removeItem(AUTH_KEY);location.reload()}
